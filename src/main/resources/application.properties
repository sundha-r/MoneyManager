spring.application.name=moneymanager
server.port=${PORT:8080}

#mysql configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/money_manager
spring.datasource.username = root
spring.datasource.password = 12345
spring.jpa.show-sql = true


server.servlet.context-path=/api/v1.0

#jpa configuration
spring.jpa.hibernate.ddl-auto = update

#eMAIL CONFIGURATION

# EMAIL CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${USER_NAME}
spring.mail.password=${MAIL_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.transport.protocol=smtp


#Jwt configuration

jwt.secret=${JWT_SECRET}

#forntend url
money.manager.frontend.url=${FRONTEND_URL}

#Activation url
app.activation.url=${BACKEND_URL}

#activate prod profile
spring.profiles.active=prod



